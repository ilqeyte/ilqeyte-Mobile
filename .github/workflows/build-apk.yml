name: Build APK

# Canonical build pipeline. Nobody needs a local Flutter toolchain —
# the installable APK is always available as a CI artifact / Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        if: ${{ vars.ENABLE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/keystore.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK (per-ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Sign APKs
        if: ${{ vars.ENABLE_SIGNING == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_DIR="build/app/outputs/flutter-apk"
          for apk in "$BUILD_DIR"/*.apk; do
            # align then sign with the v1+v2+v3 schemes
            "${ANDROID_SDK_ROOT}/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | tail -1)/zipalign" \
              -p -f 4 "$apk" "$apk.aligned"
            "${ANDROID_SDK_ROOT}/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | tail -1)/apksigner" \
              sign --ks "$KEYSTORE_PATH" \
                   --ks-pass env:KEYSTORE_PASSWORD \
                   --ks-key-alias "$KEY_ALIAS" \
                   --key-pass env:KEY_PASSWORD \
                   --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
                   "$apk.aligned"
            mv "$apk.aligned" "$apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilqeyte-mobile-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/app/outputs/flutter-apk/*.apk
