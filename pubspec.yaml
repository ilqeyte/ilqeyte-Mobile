name: ilqeyte_mobile
description: "ilqeyte Mobile — a native Flutter agentic coding harness. Cloud-brained agent loop, tools, and a Liquid Glass UI."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (provider + ChangeNotifier — the stable, boring choice).
  provider: ^6.1.2

  # Networking (streaming chat completions).
  dio: ^5.4.0

  # Local persistence. sqlite3 2.x + sqlite3_flutter_libs is the classic
  # combination that ships prebuilt native libraries with the app.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secret storage for API keys (Android Keystore / iOS Keychain).
  flutter_secure_storage: ^9.2.0

  # Rich output rendering.
  flutter_markdown: ^0.7.4

  # IDs.
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
